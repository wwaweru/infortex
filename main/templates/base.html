{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>{% block title %}Infortex - Transportation, Cargo & Logistics{% endblock %}</title>
    <link rel="icon" href="{% static 'images/icon.webp' %}" type="image/gif" sizes="16x16">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" >
    <meta content="Infortex - Transportation, Cargo & Logistics" name="description" >
    <meta content="" name="keywords">
    <meta content="" name="author">
    <!-- CSS Files
    ================================================== -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" id="bootstrap">
    <link href="{% static 'css/plugins.css' %}" rel="stylesheet" type="text/css" >
    <link href="{% static 'css/swiper.css' %}" rel="stylesheet" type="text/css" >
    <link href="{% static 'css/swiper-custom-1.css' %}" rel="stylesheet" type="text/css" >
    <link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css" >
    <link href="{% static 'css/coloring.css' %}" rel="stylesheet" type="text/css" >
    <!-- color scheme -->
    <link id="colors" href="{% static 'css/colors/scheme-03.css' %}" rel="stylesheet" type="text/css" >
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div id="wrapper">
        <a href="#" id="back-to-top"></a>
        
        <!-- page preloader begin -->
        <div id="de-loader"></div>
        <!-- page preloader close -->

        <!-- header begin -->
        <header class="transparent autoshow">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="de-flex sm-pt10">
                            <div class="de-flex-col">
                                <!-- logo begin -->
                                <div id="logo">
                                    <a href="{% url 'home' %}">
                                        <img class="logo-main" src="{% static 'images/logo-white-2.png' %}" alt="" >
                                        <img class="logo-scroll" src="{% static 'images/logo-white-2.png' %}" alt="" >
                                        <img class="logo-mobile" src="{% static 'images/logo-white-2.png' %}" alt="" >
                                    </a>
                                </div>
                                <!-- logo end -->
                            </div>
                            <div class="de-flex-col header-col-mid">
                                {% block header_content %}{% endblock %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- header close -->
        
        {% block content %}{% endblock %}
        
        {% block footer %}{% endblock %}
    </div>

    <!-- Javascript Files
    ================================================== -->
    <script src="{% static 'js/plugins.js' %}"></script>
    <script src="{% static 'js/designesia.js' %}"></script>
    <script src="{% static 'js/swiper.js' %}"></script>
    <script src="{% static 'js/custom-swiper-1.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
